# Change these first
owner: Feiert-ag # Your GitHub organization or username, where this repository lives
repo: status.feiert.ag # The name of this repository
user-agent: MopsFrank

sites:
  # Until our own monitoring exists, only the landing page is checked (DOEBELING/Feiert.ag#496)
  - name: 'Feiert.ag'
    url: https://Feiert.ag
    # Checked via Globalping from a Deutsche Telekom connection in Germany (AS3320), never from a
    # Hetzner data centre. Needs the repository secret GLOBALPING_TOKEN for the higher rate limit.
    type: globalping
    location: "Germany+AS3320"
    __dangerous__body_down_if_text_missing: 'Hier startet Deine Feier'
    icon: https://status.feiert.ag/logo/bildzeichen-glut.svg
    maxResponseTime: 1000
    skipDeleteIssues: true

# Response time graph on the history pages in Glut on the dark background
graphBorderColor: "#FF7A59"
graphBackgroundColor: "rgba(255, 122, 89, 0.25)"

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.feiert.ag
  robotsText: "User-agent: * \n Disallow: /"
  # Dark variant of the design "Dämmerung" of Feiert.ag (assets/feiertag.css)
  themeUrl: https://status.feiert.ag/feiertag.css
  # baseUrl: /your-repo-name
  logoUrl: https://status.feiert.ag/logo/wortmarke-dunkel.svg
  faviconSvg: https://status.feiert.ag/logo/favicon.svg
  favicon: https://status.feiert.ag/logo-192.png
  name: Status
  introTitle: "Status of Feiert.ag"
  # Shown once here instead of as an open issue that Upptime lists twice (incident and maintenance)
  introMessage: "Feiert.ag is still in development and should not be used in production environments yet. Data is not persisted, and the database is reset regularly."
  navbar:
    - title: Feiert.ag
      href: https://Feiert.ag

i18n:
  footer: This page is [open source]($REPO), powered by [Upptime](https://upptime.js.org)<br>[Impressum](https://legal.doebeling.de/impressum), [Datenschutzerklärung](https://legal.doebeling.de/datenschutzerklaerung)


commitMessages:
  commitAuthorName: "MopsFrank [bot]"
  commitAuthorEmail: "mopsfrank.bot@doebeling.de"

# Upptime also supports notifications, assigning issues, and more
